name: Build RealityEngineV3 Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle --version && gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Verify APK was produced
        run: |
          APK_COUNT=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was produced in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found $APK_COUNT APK file(s):"
          find app/build/outputs/apk/debug -name "*.apk" -print

      - name: Upload RealityEngineV3 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RealityEngineV3-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
